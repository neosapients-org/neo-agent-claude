[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "neo-memory-hub"
version = "0.3.0"
description = "Intelligent Memory Management for Multi-Agent AI Platforms"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [
    { name = "Neo Memory Hub Team" }
]
keywords = [
    "memory", "ai", "agents", "llm", "vector-database", 
    "milvus", "mem0", "langchain", "langgraph"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    # Core
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    # Mem0 Open Source (v1.0+ required for custom prompts, graph store, history tracking)
    "mem0ai>=1.0.1",
    # Zero-config local vector store (recommended default)
    "qdrant-client>=1.7.0",
    # Async Support
    "aiohttp>=3.9.0",
    # Embeddings & LLM
    "openai>=1.6.0",
    "tiktoken>=0.5.0",
    # Config & Utils
    "pyyaml>=6.0",
    "python-dotenv>=1.0.0",
    "structlog>=23.0.0",
]

[project.optional-dependencies]
milvus = [
    "pymilvus>=2.3.0",
]
redis = [
    "redis>=5.0.0",
    "redisvl>=0.13.2",
]
postgres = [
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "psycopg[pool]>=3.1.18",
]
api = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.25.0",
    "python-multipart>=0.0.6",
]
graph = [
    "neo4j>=5.15.0",
]
langchain = [
    "langchain-core>=0.1.0",
    "langchain>=0.1.0",
    "langchain-openai>=0.0.5",
]
langgraph = [
    "langgraph>=0.0.20",
    "langchain-core>=0.1.0",
    "langchain-openai>=0.0.5",
]
anthropic = [
    "anthropic>=0.18.0",
]
cohere = [
    "cohere>=4.0.0",
]
mcp = [
    "mcp[cli]>=1.0.0",
    "uvicorn[standard]>=0.27.0",
]
all = [
    "neo-memory-hub[api,graph,langchain,langgraph,anthropic,cohere,milvus,redis,postgres]",
]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "black>=23.12.0",
    "ruff>=0.1.9",
    "mypy>=1.8.0",
    "pre-commit>=3.6.0",
    "httpx>=0.26.0",
    "invoke>=2.2.0",
    # LangGraph for testing
    "langgraph>=0.0.20",
    "langchain-core>=0.1.0",
    "langchain-openai>=0.0.5",
    # Interactive demos
    "gradio>=4.0.0",
    "streamlit>=1.30.0",
]

[project.urls]
Homepage = "https://github.com/neomemory/neo-memory-hub"
Documentation = "https://github.com/neomemory/neo-memory-hub#readme"
Repository = "https://github.com/neomemory/neo-memory-hub"
Issues = "https://github.com/neomemory/neo-memory-hub/issues"

[project.scripts]
neo-memory = "neo_memory_hub.cli:main"
neomem-mcp = "neomem_mcp.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/neo_memory_hub", "src/neomem_mcp", "src/memory_utils"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/config",
]

# Pytest Configuration
[tool.pytest.ini_options]
minversion = "7.0"
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "-ra",
    "--strict-markers",
    "--cov=src/neo_memory_hub",
    "--cov-report=term-missing",
    "--cov-report=html:coverage_html",
    "--cov-fail-under=48",  # Reduced after removing empty managers module
]
markers = [
    "unit: Unit tests (fast, no external dependencies)",
    "integration: Integration tests (requires external services)",
    "e2e: End-to-end tests (full system tests)",
    "slow: Slow running tests",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]

# Ruff Configuration (Linting & Formatting)
[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "build",
    "dist",
    ".eggs",
]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "ARG",    # flake8-unused-arguments
    "SIM",    # flake8-simplify
    "TCH",    # flake8-type-checking
    "PTH",    # flake8-use-pathlib
    "ERA",    # eradicate
    "PL",     # Pylint
    "RUF",    # Ruff-specific rules
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # do not perform function calls in argument defaults
    "PLR0913", # Too many arguments
    "PLR2004", # Magic value in comparison
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "ARG001",  # Unused function argument (fixtures)
    "S101",    # Use of assert
]

[tool.ruff.lint.isort]
known-first-party = ["neo_memory_hub"]
force-single-line = false
lines-after-imports = 2

# Black Configuration (Formatting)
[tool.black]
line-length = 100
target-version = ["py311"]
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.venv
  | __pycache__
  | build
  | dist
)/
'''

# MyPy Configuration (Type Checking)
[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
show_error_codes = true
pretty = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = [
    "mem0.*",
    "pymilvus.*",
    "redis.*",
    "structlog.*",
]
ignore_missing_imports = true

# Coverage Configuration
[tool.coverage.run]
source = ["src/neo_memory_hub"]
branch = true
omit = [
    "*/tests/*",
    "*/__pycache__/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "@abstractmethod",
]
show_missing = true
