name: memory.delete_memory
mcp_tool_name: neomem_delete_memory
required_package: neo_memory_hub
connector: high_level
method: delete
description: |
  Delete a single memory entry by its unique ID.
  The deletion is permanent and recorded in the audit trail.
  Returns: confirmation with the deleted memory ID.
execution_mode: optional
hook_position: null
input_schema:
  type: object
  properties:
    memory_id:
      type: string
      description: "Unique identifier of the memory to delete"
  required:
    - memory_id
annotations:
  readOnlyHint: false
  destructiveHint: true
  idempotentHint: true
  openWorldHint: false
version: "0.3.0"
