version: '3.8'

services:
  neo-guardrail-api:
    build: .
    container_name: neo-guardrail-hub-api
    ports:
      - "8000:8000"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - NEO_CONFIG_PATH=/app/configs
      - LOG_LEVEL=INFO
      - PORT=8000
    volumes:
      - ./configs:/app/configs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

# For production with nginx reverse proxy
  nginx:
    image: nginx:alpine
    container_name: neo-guardrail-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - neo-guardrail-api
    restart: unless-stopped
    profiles:
      - production

networks:
  default:
    name: neo-guardrail-network
